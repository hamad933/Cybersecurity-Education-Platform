services:
  app:
    build:
      target: php-development
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_DEBUG: "true"
    user: "www-data"
    volumes:
      - .:/app
      - ../AGENTS.md:/AGENTS.md:ro
      - app-dev-vendor:/app/vendor
      - app-storage:/app/storage

volumes:
  app-dev-vendor:
