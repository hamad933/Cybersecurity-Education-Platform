name: Bounded defect report
description: Report a reproducible defect without credentials, private sources, or sensitive evidence.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, session cookies, private source content, database dumps, or exploit details.
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: Exact commit where the defect was observed.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe the reproducible result and its visible impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Use synthetic data and localhost or CI-only steps. Redact sensitive values.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Link to a GitHub Actions run or artifact and name the failed gate.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include credentials, cookies, private uploaded sources, database dumps, or production data.
          required: true
