name: CEP Jules Inspect Gateway

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cep-jules-inspect-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.actor == 'hamad933' &&
      github.event.issue.user.login == 'hamad933' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[JULES-INSPECT]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      CEP_REPOSITORY: hamad933/Cybersecurity-Education-Platform
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY unavailable' >&2; exit 20; }

      - name: Checkout governed gateway implementation
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute bounded legacy-compatible inspection
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.cep_jules_gateway.legacy_inspect_gateway
