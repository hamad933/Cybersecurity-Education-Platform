name: CEP Jules Inspect Gateway

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cep-jules-inspect-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.actor == 'hamad933' &&
      github.event.issue.user.login == 'hamad933' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[JULES-INSPECT]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      CEP_REPOSITORY: hamad933/Cybersecurity-Education-Platform

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY unavailable' >&2; exit 20; }

      - name: Execute read-only inspection
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, urllib.error, urllib.parse, urllib.request

          API = os.environ['JULES_API_BASE'].rstrip('/')
          JKEY = os.environ['JULES_API_KEY']
          GH = os.environ['GH_TOKEN']
          REPO = os.environ['CEP_REPOSITORY']
          ISSUE = os.environ['ISSUE_NUMBER']
          COMMENT_CHUNK = 34000

          def req(method, url, *, token=None, body=None, timeout=60):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method)
              if token == 'github':
                  r.add_header('Authorization', f'Bearer {GH}')
                  r.add_header('Accept', 'application/vnd.github+json')
                  r.add_header('X-GitHub-Api-Version', '2022-11-28')
              elif token == 'jules':
                  r.add_header('x-goog-api-key', JKEY)
              if data is not None:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as x:
                      raw = x.read()
                      return x.status, json.loads(raw.decode()) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors='replace')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {'error_text': raw[:1500]}
                  return e.code, payload

          def gh(method, path, body=None):
              return req(method, f'https://api.github.com/repos/{REPO}{path}', token='github', body=body, timeout=30)

          def jules(method, path):
              return req(method, API + path, token='jules')

          def comment(text):
              status, _ = gh('POST', f'/issues/{ISSUE}/comments', {'body': text})
              if status not in (200, 201):
                  raise RuntimeError(f'comment_failed:{status}')

          def sanitize(text):
              text = str(text or '')
              patterns = [
                  r'(?i)(JULES_API_KEY\s*[=:]\s*)\S+',
                  r'(?i)(GDRIVE_SA_JSON_B64\s*[=:]\s*)\S+',
                  r'(?i)(authorization:\s*bearer\s+)\S+',
                  r'(?i)(x-goog-api-key\s*[=:]\s*)\S+',
              ]
              for pat in patterns:
                  text = re.sub(pat, r'\1[REDACTED]', text)
              return text

          def digest(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          def list_activities(session_id):
              rows = []
              token = None
              for _ in range(100):
                  query = {'pageSize': 100}
                  if token:
                      query['pageToken'] = token
                  status, out = jules('GET', f'/sessions/{session_id}/activities?' + urllib.parse.urlencode(query))
                  if status != 200:
                      return status, rows, out
                  rows.extend(out.get('activities') or [])
                  token = str(out.get('nextPageToken') or '')
                  if not token:
                      return 200, rows, out
              return 508, rows, {'error': 'ACTIVITY_PAGINATION_LIMIT_EXCEEDED'}

          def emit_json_receipt(receipt, payload):
              data = json.dumps(payload, ensure_ascii=False, separators=(',', ':'))
              if len(data) <= 50000:
                  comment(f'{receipt}\n```json\n{data}\n```')
                  return
              parts = [data[i:i + COMMENT_CHUNK] for i in range(0, len(data), COMMENT_CHUNK)]
              for i, part in enumerate(parts, start=1):
                  fragment = json.dumps({'part': i, 'parts': len(parts), 'json_fragment': part}, ensure_ascii=False, separators=(',', ':'))
                  comment(f'{receipt}\npart={i}/{len(parts)}\n```json\n{fragment}\n```')

          def emit_exact_text(receipt, kind, metadata, text):
              safe = sanitize(text)
              parts = [safe[i:i + COMMENT_CHUNK] for i in range(0, len(safe), COMMENT_CHUNK)] or ['']
              header = dict(metadata)
              header.update({'text_kind': kind, 'text_chars': len(safe), 'text_sha256': digest(safe), 'parts': len(parts)})
              comment(f'{receipt}\nmetadata\n```json\n' + json.dumps(header, ensure_ascii=False, separators=(',', ':')) + '\n```')
              for i, part in enumerate(parts, start=1):
                  fragment = {'part': i, 'parts': len(parts), 'text_fragment': part}
                  comment(f'{receipt}\n{kind}_part={i}/{len(parts)}\n```json\n' + json.dumps(fragment, ensure_ascii=False, separators=(',', ':')) + '\n```')

          try:
              payload = json.loads(os.environ.get('ISSUE_BODY') or '')
          except json.JSONDecodeError as e:
              comment(f'JULES_INSPECT_REJECTED\nreason=INVALID_JSON\ndetail={e}')
              raise SystemExit(2)

          if not isinstance(payload, dict):
              comment('JULES_INSPECT_REJECTED\nreason=BODY_MUST_BE_JSON_OBJECT')
              raise SystemExit(2)

          action = str(payload.get('action') or '').strip()
          rid = str(payload.get('request_id') or '').strip()
          sid = str(payload.get('session_id') or '').strip()

          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:-]{0,119}', rid):
              comment('JULES_INSPECT_REJECTED\nreason=INVALID_REQUEST_ID')
              raise SystemExit(2)

          allowed = {'get_plan', 'get_agent_messages', 'get_changeset_index', 'get_latest_changeset', 'get_bash_outputs'}
          if action not in allowed:
              comment(f'JULES_INSPECT_REJECTED\nrequest_id={rid}\nreason=ACTION_NOT_ALLOWED\naction={action}')
              raise SystemExit(2)

          if not re.fullmatch(r'[0-9]+', sid):
              comment(f'JULES_INSPECT_REJECTED\nrequest_id={rid}\nreason=VALID_SESSION_ID_REQUIRED')
              raise SystemExit(2)

          status, activities, out = list_activities(sid)
          if status != 200:
              comment(f'JULES_INSPECT_RECEIPT request_id={rid}\naction={action}\nhttp_status={status}\nsession_id={sid}\noutcome=READ_FAILED')
              raise SystemExit(7)

          receipt = f'JULES_INSPECT_RECEIPT request_id={rid}\naction={action}\nhttp_status=200\nsession_id={sid}'

          if action == 'get_plan':
              found = None
              for a in activities:
                  pg = a.get('planGenerated')
                  if pg:
                      found = (a, pg)
              if not found:
                  comment(receipt + '\noutcome=PLAN_NOT_FOUND')
                  raise SystemExit(0)
              a, pg = found
              plan = pg.get('plan') or {}
              steps = []
              for i, step in enumerate(plan.get('steps') or [], start=1):
                  if isinstance(step, dict):
                      steps.append({'index': i, 'title': sanitize(step.get('title'))[:2000], 'description': sanitize(step.get('description'))[:12000]})
              emit_json_receipt(receipt, {'activity_name': a.get('name'), 'createTime': a.get('createTime'), 'step_count': len(steps), 'steps': steps, 'activity_count_scanned': len(activities)})
              raise SystemExit(0)

          if action == 'get_agent_messages':
              rows = []
              for a in activities:
                  am = a.get('agentMessaged') or {}
                  msg = am.get('agentMessage')
                  if msg:
                      rows.append({'activity_name': a.get('name'), 'createTime': a.get('createTime'), 'message': sanitize(msg)})
              emit_json_receipt(receipt, {'activity_count_scanned': len(activities), 'message_count': len(rows), 'messages': rows})
              raise SystemExit(0)

          changesets = []
          for a in activities:
              for artifact_index, artifact in enumerate(a.get('artifacts') or [], start=1):
                  if not isinstance(artifact, dict):
                      continue
                  cs = artifact.get('changeSet')
                  if isinstance(cs, dict):
                      gp = cs.get('gitPatch') or {}
                      patch = str(gp.get('unidiffPatch') or '')
                      changesets.append({'activity_name': a.get('name'), 'createTime': a.get('createTime'), 'artifact_index': artifact_index, 'source': sanitize(cs.get('source')), 'baseCommitId': str(gp.get('baseCommitId') or ''), 'suggestedCommitMessage': sanitize(gp.get('suggestedCommitMessage')), 'patch': patch})

          if action == 'get_changeset_index':
              rows = []
              for cs in changesets:
                  safe_patch = sanitize(cs['patch'])
                  rows.append({'activity_name': cs['activity_name'], 'createTime': cs['createTime'], 'artifact_index': cs['artifact_index'], 'source': cs['source'], 'baseCommitId': cs['baseCommitId'], 'suggestedCommitMessage': cs['suggestedCommitMessage'], 'list_patch_chars': len(safe_patch), 'list_patch_sha256': digest(safe_patch), 'requires_activity_get_for_exact_patch': not bool(safe_patch)})
              emit_json_receipt(receipt, {'activity_count_scanned': len(activities), 'changeset_count': len(rows), 'changesets': rows})
              raise SystemExit(0)

          if action == 'get_latest_changeset':
              latest = None
              hydrated_activity_reads = 0
              for a in reversed(activities):
                  if not any(isinstance(z, dict) and isinstance(z.get('changeSet'), dict) for z in (a.get('artifacts') or [])):
                      continue
                  activity_name = str(a.get('name') or '')
                  if not re.fullmatch(r'sessions/[0-9]+/activities/[A-Za-z0-9._:-]+', activity_name):
                      comment(receipt + '\noutcome=INVALID_ACTIVITY_NAME_FROM_PROVIDER')
                      raise SystemExit(7)
                  hstatus, full = jules('GET', '/' + activity_name)
                  hydrated_activity_reads += 1
                  if hstatus != 200:
                      comment(receipt + f'\noutcome=ACTIVITY_HYDRATION_READ_FAILED\nactivity_name={activity_name}\nactivity_http_status={hstatus}')
                      raise SystemExit(7)
                  for artifact_index, artifact in enumerate(full.get('artifacts') or [], start=1):
                      if not isinstance(artifact, dict):
                          continue
                      cs = artifact.get('changeSet')
                      if not isinstance(cs, dict):
                          continue
                      gp = cs.get('gitPatch') or {}
                      patch = str(gp.get('unidiffPatch') or '')
                      if not patch:
                          continue
                      latest = {'activity_name': full.get('name') or activity_name, 'createTime': full.get('createTime') or a.get('createTime'), 'artifact_index': artifact_index, 'source': sanitize(cs.get('source')), 'baseCommitId': str(gp.get('baseCommitId') or ''), 'suggestedCommitMessage': sanitize(gp.get('suggestedCommitMessage')), 'patch': patch}
                      break
                  if latest:
                      break
              if not latest:
                  comment(receipt + f'\noutcome=CHANGESET_PATCH_NOT_AVAILABLE_AFTER_ACTIVITY_GET\nhydrated_activity_reads={hydrated_activity_reads}')
                  raise SystemExit(0)
              metadata = {'activity_name': latest['activity_name'], 'createTime': latest['createTime'], 'artifact_index': latest['artifact_index'], 'source': latest['source'], 'baseCommitId': latest['baseCommitId'], 'suggestedCommitMessage': latest['suggestedCommitMessage'], 'changeset_count_scanned': len(changesets), 'activity_count_scanned': len(activities), 'hydrated_activity_reads': hydrated_activity_reads}
              emit_exact_text(receipt, 'unidiffPatch', metadata, latest['patch'])
              raise SystemExit(0)

          if action == 'get_bash_outputs':
              candidate_activities = [a for a in activities if any(isinstance(z, dict) and isinstance(z.get('bashOutput'), dict) for z in (a.get('artifacts') or []))]
              hydrated_bash_outputs = []
              for a in candidate_activities:
                  activity_name = str(a.get('name') or '')
                  if not re.fullmatch(r'sessions/[0-9]+/activities/[A-Za-z0-9._:-]+', activity_name):
                      comment(receipt + '\noutcome=INVALID_ACTIVITY_NAME_FROM_PROVIDER')
                      raise SystemExit(7)
                  hstatus, full = jules('GET', '/' + activity_name)
                  if hstatus != 200:
                      comment(receipt + f'\noutcome=ACTIVITY_HYDRATION_READ_FAILED\nactivity_name={activity_name}\nactivity_http_status={hstatus}')
                      raise SystemExit(7)
                  for artifact_index, artifact in enumerate(full.get('artifacts') or [], start=1):
                      if not isinstance(artifact, dict):
                          continue
                      bo = artifact.get('bashOutput')
                      if isinstance(bo, dict):
                          hydrated_bash_outputs.append({'activity_name': full.get('name') or activity_name, 'createTime': full.get('createTime') or a.get('createTime'), 'artifact_index': artifact_index, 'command': sanitize(bo.get('command')), 'exitCode': bo.get('exitCode'), 'output': str(bo.get('output') or '')})
              if not hydrated_bash_outputs:
                  comment(receipt + '\noutcome=BASH_OUTPUT_NOT_FOUND_AFTER_ACTIVITY_GET')
                  raise SystemExit(0)
              index = []
              for i, bo in enumerate(hydrated_bash_outputs, start=1):
                  safe_output = sanitize(bo['output'])
                  index.append({'output_index': i, 'activity_name': bo['activity_name'], 'createTime': bo['createTime'], 'artifact_index': bo['artifact_index'], 'command': bo['command'], 'exitCode': bo['exitCode'], 'output_chars': len(safe_output), 'output_sha256': digest(safe_output)})
              emit_json_receipt(receipt, {'activity_count_scanned': len(activities), 'hydrated_activity_reads': len(candidate_activities), 'bash_output_count': len(index), 'bash_outputs': index})
              for i, bo in enumerate(hydrated_bash_outputs, start=1):
                  emit_exact_text(receipt + f'\noutput_index={i}', 'bashOutput', {'activity_name': bo['activity_name'], 'createTime': bo['createTime'], 'artifact_index': bo['artifact_index'], 'command': bo['command'], 'exitCode': bo['exitCode']}, bo['output'])
              raise SystemExit(0)
          PY
