name: CEP Jules Control Gateway

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cep-jules-control-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.actor == 'hamad933' &&
      github.event.issue.user.login == 'hamad933' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[JULES-CONTROL]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      CEP_REPOSITORY: hamad933/Cybersecurity-Education-Platform
      CEP_JULES_SOURCE: sources/github/hamad933/Cybersecurity-Education-Platform

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY unavailable' >&2; exit 20; }

      - name: Execute bounded request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request

          API = os.environ['JULES_API_BASE'].rstrip('/')
          JKEY = os.environ['JULES_API_KEY']
          GH = os.environ['GH_TOKEN']
          REPO = os.environ['CEP_REPOSITORY']
          SOURCE = os.environ['CEP_JULES_SOURCE']
          ISSUE = os.environ['ISSUE_NUMBER']

          def req(method, url, *, token=None, body=None, timeout=60):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method)
              if token == 'github':
                  r.add_header('Authorization', f'Bearer {GH}')
                  r.add_header('Accept', 'application/vnd.github+json')
                  r.add_header('X-GitHub-Api-Version', '2022-11-28')
              elif token == 'jules':
                  r.add_header('x-goog-api-key', JKEY)
              if data is not None:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as x:
                      raw = x.read()
                      return x.status, json.loads(raw.decode()) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors='replace')
                  try: payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError: payload = {'error_text': raw[:1500]}
                  return e.code, payload

          def gh(method, path, body=None):
              return req(method, f'https://api.github.com/repos/{REPO}{path}', token='github', body=body, timeout=30)

          def jules(method, path, body=None):
              return req(method, API + path, token='jules', body=body)

          def comment(text):
              status, _ = gh('POST', f'/issues/{ISSUE}/comments', {'body': text})
              if status not in (200, 201): raise RuntimeError(f'comment_failed:{status}')

          try:
              payload = json.loads(os.environ.get('ISSUE_BODY') or '')
          except json.JSONDecodeError as e:
              comment(f'JULES_CONTROL_REJECTED\nreason=INVALID_JSON\ndetail={e}')
              raise SystemExit(2)
          if not isinstance(payload, dict):
              comment('JULES_CONTROL_REJECTED\nreason=BODY_MUST_BE_JSON_OBJECT')
              raise SystemExit(2)

          action = str(payload.get('action') or '').strip()
          rid = str(payload.get('request_id') or '').strip()
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:-]{0,119}', rid):
              comment('JULES_CONTROL_REJECTED\nreason=INVALID_REQUEST_ID')
              raise SystemExit(2)

          allowed = {'create_session','get_session','list_sessions','list_activities','send_message','approve_plan'}
          if action not in allowed:
              comment(f'JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=ACTION_NOT_ALLOWED\naction={action}')
              raise SystemExit(2)

          _, comments = gh('GET', f'/issues/{ISSUE}/comments?per_page=100')
          text = '\n'.join(str(x.get('body') or '') for x in comments if isinstance(x, dict))
          receipt = f'JULES_CONTROL_RECEIPT request_id={rid}'
          intent = f'JULES_CONTROL_WRITE_INTENT request_id={rid}'
          if receipt in text:
              print('exact receipt already exists; no replay')
              raise SystemExit(0)
          if action in {'create_session','send_message','approve_plan'} and intent in text:
              comment(f'JULES_CONTROL_BLOCKED\nrequest_id={rid}\nreason=UNKNOWN_PRIOR_WRITE_OUTCOME__AUTHORITATIVE_PROVIDER_READ_REQUIRED\nblind_retry=false')
              raise SystemExit(3)

          if action == 'create_session':
              need = ['task_id','starting_branch','expected_sha','title','prompt']
              missing = [k for k in need if not str(payload.get(k) or '').strip()]
              if missing:
                  comment(f"JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=MISSING_FIELDS\nfields={','.join(missing)}")
                  raise SystemExit(2)
              branch = str(payload['starting_branch']).strip()
              sha = str(payload['expected_sha']).strip().lower()
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  comment(f'JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=EXPECTED_SHA_INVALID')
                  raise SystemExit(2)
              status, b = gh('GET', '/branches/' + urllib.parse.quote(branch, safe=''))
              actual = str((b.get('commit') or {}).get('sha') or '').lower() if status == 200 else ''
              if actual != sha:
                  comment(f'JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=BRANCH_HEAD_DRIFT\nbranch={branch}\nexpected_sha={sha}\nactual_sha={actual or "MISSING"}')
                  raise SystemExit(4)
              status, sources = jules('GET','/sources')
              names = {str(x.get('name')) for x in sources.get('sources', [])} if status == 200 else set()
              if status != 200 or SOURCE not in names:
                  comment(f'JULES_CONTROL_BLOCKED\nrequest_id={rid}\nreason=JULES_SOURCE_READ_FAILED_OR_SOURCE_MISSING\nhttp_status={status}')
                  raise SystemExit(5)
              comment(f'{intent}\naction=create_session\nbranch={branch}\nexpected_sha={sha}\nrequire_plan_approval=true\nauto_create_pr=false\nblind_retry=false')
              body = {
                  'prompt': str(payload['prompt']),
                  'title': str(payload['title']),
                  'sourceContext': {'source': SOURCE, 'githubRepoContext': {'startingBranch': branch}},
                  'requirePlanApproval': True,
              }
              status, out = jules('POST','/sessions', body)
              if status not in (200,201):
                  comment(f'JULES_CONTROL_UNKNOWN_WRITE_OUTCOME\nrequest_id={rid}\naction=create_session\nhttp_status={status}\nblind_retry=false\nnext=LIST_SESSIONS_AND_RECONCILE_BEFORE_ANY_REPLAY')
                  raise SystemExit(6)
              comment(f"{receipt}\naction=create_session\noutcome=CREATED\ntask_id={payload['task_id']}\nsession_id={out.get('id','')}\nstate={out.get('state','')}\nurl={out.get('url','')}\nstarting_branch={branch}\nexpected_sha={sha}\nrequire_plan_approval=true\nauto_create_pr=false")
              raise SystemExit(0)

          if action in {'get_session','list_activities','send_message','approve_plan'}:
              sid = str(payload.get('session_id') or '').strip()
              if not re.fullmatch(r'[0-9]+', sid):
                  comment(f'JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=VALID_SESSION_ID_REQUIRED')
                  raise SystemExit(2)

          if action == 'get_session':
              status, out = jules('GET', f'/sessions/{sid}')
              comment(f"{receipt}\naction=get_session\nhttp_status={status}\nsession_id={sid}\nstate={out.get('state','')}\nupdate_time={out.get('updateTime','')}\nurl={out.get('url','')}")
              raise SystemExit(0 if status == 200 else 7)

          if action == 'list_sessions':
              status, out = jules('GET','/sessions?pageSize=100')
              rows = [{'id':x.get('id'),'title':x.get('title'),'state':x.get('state'),'updateTime':x.get('updateTime')} for x in out.get('sessions',[])[:100]] if status == 200 else []
              data = json.dumps(rows, ensure_ascii=False, separators=(',',':'))[:50000]
              comment(f'{receipt}\naction=list_sessions\nhttp_status={status}\n```json\n{data}\n```')
              raise SystemExit(0 if status == 200 else 7)

          if action == 'list_activities':
              status, out = jules('GET', f'/sessions/{sid}/activities?pageSize=100')
              rows=[]
              for a in out.get('activities',[])[-40:] if status == 200 else []:
                  rows.append({'createTime':a.get('createTime'),'originator':a.get('originator'),'description':a.get('description'),'hasPlan':bool(a.get('planGenerated')),'hasAgentMessage':bool(a.get('agentMessaged')),'hasChangeSet':any(bool(z.get('changeSet')) for z in (a.get('artifacts') or []) if isinstance(z,dict))})
              data=json.dumps(rows,ensure_ascii=False,separators=(',',':'))[:50000]
              comment(f'{receipt}\naction=list_activities\nhttp_status={status}\nsession_id={sid}\n```json\n{data}\n```')
              raise SystemExit(0 if status == 200 else 7)

          if action == 'send_message':
              prompt = str(payload.get('prompt') or '')
              if not prompt:
                  comment(f'JULES_CONTROL_REJECTED\nrequest_id={rid}\nreason=PROMPT_REQUIRED')
                  raise SystemExit(2)
              comment(f'{intent}\naction=send_message\nsession_id={sid}\nblind_retry=false')
              status, _ = jules('POST', f'/sessions/{sid}:sendMessage', {'prompt':prompt})
              if status not in (200,201,204):
                  comment(f'{receipt}\naction=send_message\noutcome=UNKNOWN\nsession_id={sid}\nhttp_status={status}\nblind_retry=false')
                  raise SystemExit(6)
              comment(f'{receipt}\naction=send_message\noutcome=SENT\nsession_id={sid}')
              raise SystemExit(0)

          if action == 'approve_plan':
              comment(f'{intent}\naction=approve_plan\nsession_id={sid}\nblind_retry=false')
              status, _ = jules('POST', f'/sessions/{sid}:approvePlan', {})
              if status not in (200,201,204):
                  comment(f'{receipt}\naction=approve_plan\noutcome=UNKNOWN\nsession_id={sid}\nhttp_status={status}\nblind_retry=false')
                  raise SystemExit(6)
              comment(f'{receipt}\naction=approve_plan\noutcome=APPROVED\nsession_id={sid}')
              raise SystemExit(0)
          PY
