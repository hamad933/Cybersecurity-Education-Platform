name: CEP Jules Gateway v2 Mutation Canary

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Public-safe CEP Jules Gateway v2.1 mutation-canary envelope JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      request_key: ${{ steps.route.outputs.request_key }}
      effect_key: ${{ steps.route.outputs.effect_key }}
      intent_marker: ${{ steps.route.outputs.intent_marker }}
      completed_marker: ${{ steps.route.outputs.completed_marker }}
      unknown_marker: ${{ steps.route.outputs.unknown_marker }}
      create_effect_marker: ${{ steps.route.outputs.create_effect_marker }}
      is_create: ${{ steps.route.outputs.is_create }}
    env:
      CEP_JULES_REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: route
        name: Derive bounded request and effect identities
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.cep_jules_gateway.mutation_cli route \
            --output-dir "$RUNNER_TEMP/cep-jules-v2-route"

  request-serialized-worker:
    needs: route
    concurrency:
      group: cep-jules-v2-${{ needs.route.outputs.request_key }}
      cancel-in-progress: false
    uses: ./.github/workflows/cep-jules-v2-mutation-worker.yml
    with:
      request_json: ${{ inputs.request_json }}
      effect_key: ${{ needs.route.outputs.effect_key }}
      intent_marker: ${{ needs.route.outputs.intent_marker }}
      completed_marker: ${{ needs.route.outputs.completed_marker }}
      unknown_marker: ${{ needs.route.outputs.unknown_marker }}
      create_effect_marker: ${{ needs.route.outputs.create_effect_marker }}
      is_create: ${{ needs.route.outputs.is_create }}
    secrets: inherit
