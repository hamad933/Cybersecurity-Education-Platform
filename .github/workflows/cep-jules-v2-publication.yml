name: CEP Jules Gateway v2.3 Candidate Publication

run-name: CEP-V23-PUBLISH ${{ inputs.logical_task }} / req-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Public-safe idempotency request identifier
        required: true
        type: string
      controller_id:
        description: Delegated Controller identity
        required: true
        type: choice
        options: [PARENT, A, B, C]
      lane:
        description: Governed CEP lane
        required: true
        type: choice
        options: [PARENT, W01_W02, W03_W04, W05]
      logical_task:
        description: Existing logical task identifier
        required: true
        type: string
      write_domain:
        description: Existing exclusive write-domain identifier
        required: true
        type: string
      session_id:
        description: Exact existing Jules session id
        required: true
        type: string
      expected_session_state:
        description: Exact quiescent state observed during Controller review
        required: true
        type: choice
        options: [COMPLETED, AWAITING_USER_FEEDBACK]
      expected_session_update_time:
        description: Exact Jules updateTime observed during Controller review
        required: true
        type: string
      target_branch:
        description: Existing isolated work/fix/checkpoint/candidate branch; never main
        required: true
        type: string
      expected_remote_sha:
        description: Exact current remote branch SHA and Jules patch baseCommitId
        required: true
        type: string
      expected_review_sha256:
        description: SHA-256 of the exact reviewed Jules unidiff patch
        required: true
        type: string
      expected_paths_sha256:
        description: SHA-256 of sorted unique changed paths, each newline terminated
        required: true
        type: string
      bridge_issue_number:
        description: Owner-authored CEP-V23-PUBLISH issue number; empty for direct owner dispatch
        required: false
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: cep-jules-v23-publish-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      EXPECTED_REMOTE_SHA: ${{ inputs.expected_remote_sha }}
      EXPECTED_REVIEW_SHA256: ${{ inputs.expected_review_sha256 }}
      EXPECTED_PATHS_SHA256: ${{ inputs.expected_paths_sha256 }}
      EXPECTED_SESSION_STATE: ${{ inputs.expected_session_state }}
      EXPECTED_SESSION_UPDATE_TIME: ${{ inputs.expected_session_update_time }}
      SESSION_ID: ${{ inputs.session_id }}
      REQUEST_ID: ${{ inputs.request_id }}
      LOGICAL_TASK: ${{ inputs.logical_task }}
      WRITE_DOMAIN: ${{ inputs.write_domain }}
      CONTROLLER_ID: ${{ inputs.controller_id }}
      LANE: ${{ inputs.lane }}
      BRIDGE_ISSUE_NUMBER: ${{ inputs.bridge_issue_number }}
      PATCH_FILE: /tmp/cep-jules-publication/reviewed.patch
      PREFLIGHT_RECEIPT: /tmp/cep-jules-publication/preflight.json
      RESULT_RECEIPT: /tmp/cep-jules-publication/result.json

    steps:
      - name: Enforce owner or authenticated issue-bridge dispatch gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main" || { echo "MAIN_DISPATCH_GATE_FAILED" >&2; exit 2; }

          if [ "$ACTOR" = "$REPO_OWNER" ]; then
            echo "DIRECT_OWNER_DISPATCH_VERIFIED"
            exit 0
          fi

          test "$ACTOR" = "github-actions[bot]" || {
            echo "OWNER_GATE_FAILED actor=$ACTOR" >&2
            exit 2
          }
          [[ "$BRIDGE_ISSUE_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "OWNER_GATE_FAILED missing_or_invalid_bridge_issue_number" >&2
            exit 2
          }

          ISSUE_JSON="$(gh api "/repos/$REPO/issues/$BRIDGE_ISSUE_NUMBER")"
          export ISSUE_JSON REPO REPO_OWNER

          python3 - <<'PY'
          import json
          import os
          import sys

          try:
              issue = json.loads(os.environ["ISSUE_JSON"])
              repo = os.environ["REPO"]
              owner = os.environ["REPO_OWNER"]

              if issue.get("repository_url") != f"https://api.github.com/repos/{repo}":
                  raise ValueError("issue repository mismatch")
              if "pull_request" in issue:
                  raise ValueError("pull request cannot authorize publication")
              if issue.get("user", {}).get("login") != owner:
                  raise ValueError("issue author is not repository owner")
              if issue.get("author_association") != "OWNER":
                  raise ValueError("issue author_association is not OWNER")
              if not issue.get("title", "").startswith("[CEP-V23-PUBLISH]"):
                  raise ValueError("issue title does not begin with [CEP-V23-PUBLISH]")

              body = json.loads(issue.get("body") or "{}")
              expected = {
                  "request_id": os.environ["REQUEST_ID"],
                  "controller_id": os.environ["CONTROLLER_ID"],
                  "lane": os.environ["LANE"],
                  "logical_task": os.environ["LOGICAL_TASK"],
                  "write_domain": os.environ["WRITE_DOMAIN"],
                  "session_id": os.environ["SESSION_ID"],
                  "expected_session_state": os.environ["EXPECTED_SESSION_STATE"],
                  "expected_session_update_time": os.environ["EXPECTED_SESSION_UPDATE_TIME"],
                  "target_branch": os.environ["TARGET_BRANCH"],
                  "expected_remote_sha": os.environ["EXPECTED_REMOTE_SHA"],
                  "expected_review_sha256": os.environ["EXPECTED_REVIEW_SHA256"],
                  "expected_paths_sha256": os.environ["EXPECTED_PATHS_SHA256"],
              }

              if set(body) != set(expected):
                  raise ValueError("issue body keys do not match governed publication packet")
              if body != expected:
                  mismatched = [key for key in expected if body.get(key) != expected[key]]
                  raise ValueError(f"issue body/input mismatch: {','.join(mismatched)}")
          except Exception as exc:
              print(f"BRIDGE_PROVENANCE_FAILED: {exc}", file=sys.stderr)
              raise SystemExit(2)

          print("BRIDGE_PROVENANCE_VERIFIED")
          PY

      - name: Checkout exact trusted Gateway revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve and bind exact reviewed Jules changeSet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PATCH_FILE")"
          python -m tools.cep_jules_gateway.publication \
            --repository "${{ github.repository }}" \
            --controller-id "$CONTROLLER_ID" \
            --lane "$LANE" \
            --request-id "$REQUEST_ID" \
            --logical-task "$LOGICAL_TASK" \
            --write-domain "$WRITE_DOMAIN" \
            --session-id "$SESSION_ID" \
            --expected-session-state "$EXPECTED_SESSION_STATE" \
            --expected-session-update-time "$EXPECTED_SESSION_UPDATE_TIME" \
            --target-branch "$TARGET_BRANCH" \
            --expected-base-sha "$EXPECTED_REMOTE_SHA" \
            --expected-review-sha256 "$EXPECTED_REVIEW_SHA256" \
            --expected-paths-sha256 "$EXPECTED_PATHS_SHA256" \
            --patch-out "$PATCH_FILE" \
            --receipt-out "$PREFLIGHT_RECEIPT"

      - name: Verify exact remote branch and detect idempotent completion
        id: remote
        shell: bash
        run: |
          set -euo pipefail
          REF="refs/heads/$TARGET_BRANCH"
          REMOTE_SHA="$(git ls-remote --heads origin "$REF" | awk 'NR==1 {print $1}')"
          test -n "$REMOTE_SHA" || { echo "TARGET_BRANCH_NOT_FOUND" >&2; exit 3; }
          echo "pre_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$REF:refs/remotes/origin/cep-publish-current"
          if [ "$REMOTE_SHA" != "$EXPECTED_REMOTE_SHA" ]; then
            PARENT_SHA="$(git rev-parse 'refs/remotes/origin/cep-publish-current^' 2>/dev/null || true)"
            MESSAGE="$(git show -s --format=%B refs/remotes/origin/cep-publish-current)"
            if [ "$PARENT_SHA" = "$EXPECTED_REMOTE_SHA" ] \
              && grep -Fqx "CEP-Jules-Session: $SESSION_ID" <<<"$MESSAGE" \
              && grep -Fqx "CEP-Review-SHA256: $EXPECTED_REVIEW_SHA256" <<<"$MESSAGE"; then
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "published_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
              echo "IDEMPOTENT_ALREADY_PUBLISHED=$REMOTE_SHA"
              exit 0
            fi
            echo "REMOTE_BRANCH_DRIFT expected=$EXPECTED_REMOTE_SHA actual=$REMOTE_SHA" >&2
            exit 4
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"

      - name: Apply exact provider patch to exact reviewed remote SHA
        if: steps.remote.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_REMOTE_SHA"
          test -z "$(git status --porcelain=v1 -uall)" || { echo "WORKTREE_NOT_CLEAN" >&2; exit 5; }
          git apply --check "$PATCH_FILE"
          git apply --index --whitespace=nowarn "$PATCH_FILE"
          test -n "$(git diff --cached --name-only)" || { echo "PATCH_PRODUCED_NO_STAGED_CHANGE" >&2; exit 5; }

          ACTUAL_PATHS_SHA="$(git diff --cached --no-renames --name-only | LC_ALL=C sort -u | python -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          test "$ACTUAL_PATHS_SHA" = "$EXPECTED_PATHS_SHA256" || {
            echo "STAGED_PATH_IDENTITY_MISMATCH expected=$EXPECTED_PATHS_SHA256 actual=$ACTUAL_PATHS_SHA" >&2
            exit 5
          }

      - name: Commit bounded candidate locally
        if: steps.remote.outputs.already != 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEP Jules Gateway"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(cep): publish $LOGICAL_TASK candidate" \
            -m "CEP-Jules-Session: $SESSION_ID" \
            -m "CEP-Review-SHA256: $EXPECTED_REVIEW_SHA256" \
            -m "CEP-Paths-SHA256: $EXPECTED_PATHS_SHA256" \
            -m "CEP-Publication-Request: $REQUEST_ID" \
            -m "CEP-Write-Domain: $WRITE_DOMAIN"
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "local_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "LOCAL_CANDIDATE_SHA=$LOCAL_SHA"

      - name: Non-force publish and authoritative remote SHA readback
        if: steps.remote.outputs.already != 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_SHA="${{ steps.commit.outputs.local_sha }}"
          set +e
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          PUSH_RC=$?
          set -e

          POST_SHA="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"
          if [ "$POST_SHA" != "$LOCAL_SHA" ]; then
            echo "PUBLICATION_POSTCONDITION_FAILED push_rc=$PUSH_RC local=$LOCAL_SHA remote=$POST_SHA" >&2
            exit 6
          fi
          echo "published_sha=$POST_SHA" >> "$GITHUB_OUTPUT"
          if [ "$PUSH_RC" -eq 0 ]; then
            echo "PUBLICATION_VERIFIED=$POST_SHA"
          else
            echo "PUBLICATION_RECONCILED_AFTER_AMBIGUOUS_PUSH=$POST_SHA"
          fi

      - name: Write machine-readable publication receipt
        if: success()
        shell: bash
        env:
          PRE_SHA: ${{ steps.remote.outputs.pre_sha }}
          ALREADY: ${{ steps.remote.outputs.already }}
          REMOTE_ALREADY_SHA: ${{ steps.remote.outputs.published_sha }}
          NEW_SHA: ${{ steps.push.outputs.published_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          preflight_path = pathlib.Path(os.environ["PREFLIGHT_RECEIPT"])
          preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
          published = os.environ.get("REMOTE_ALREADY_SHA") or os.environ.get("NEW_SHA")
          result = {
              "schema_version": "cep.jules.publication-result/v1",
              "request_id": os.environ["REQUEST_ID"],
              "controller_id": os.environ["CONTROLLER_ID"],
              "lane": os.environ["LANE"],
              "logical_task": os.environ["LOGICAL_TASK"],
              "write_domain": os.environ["WRITE_DOMAIN"],
              "target_branch": os.environ["TARGET_BRANCH"],
              "pre_sha": os.environ.get("PRE_SHA"),
              "published_sha": published,
              "already_published": os.environ.get("ALREADY") == "true",
              "review_sha256": os.environ["EXPECTED_REVIEW_SHA256"],
              "paths_sha256": os.environ["EXPECTED_PATHS_SHA256"],
              "session_id": os.environ["SESSION_ID"],
              "provider_activity": preflight["activity_name"],
              "postcondition": "REMOTE_REF_EQUALS_PUBLISHED_SHA",
              "merge_release_deploy": "NOT_AUTHORIZED_NOT_PERFORMED",
          }
          path = pathlib.Path(os.environ["RESULT_RECEIPT"])
          path.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(f"PUBLISHED_SHA={published}")
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cep-jules-publication-${{ github.run_id }}
          path: /tmp/cep-jules-publication/
          if-no-files-found: warn
          retention-days: 14
