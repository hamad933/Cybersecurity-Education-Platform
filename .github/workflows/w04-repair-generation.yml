name: W04 Repair Generation

on:
  push:
    branches:
      - feat/cep-progress-evidence

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cep-progress-evidence
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Repair Composer and Pint gates
        shell: bash
        run: |
          set -euo pipefail
          composer update league/commonmark --with-all-dependencies --minimal-changes --no-interaction --prefer-dist
          composer audit --locked
          composer install --no-interaction --prefer-dist
          vendor/bin/pint app/Modules/Evidence/Application/ProgressEvidenceService.php tests/Feature/ProgressEvidenceGovernanceTest.php
          vendor/bin/pint --test app/Modules/Evidence/Application/ProgressEvidenceService.php tests/Feature/ProgressEvidenceGovernanceTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Repair npm audit gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          npm --version
          npm update nanoid --package-lock-only
          npm audit --package-lock-only --audit-level=high
          node -e "const fs=require('fs'); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(l.packages?.['node_modules/nanoid']?.version!=='3.3.18') throw new Error('nanoid lock repair did not resolve to 3.3.18');"

      - name: Repair deterministic Chromium cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/ci/browser_evidence.mjs')
          text = path.read_text()
          text = text.replace("import { spawn } from 'node:child_process';\n", "import { spawn } from 'node:child_process';\nimport { once } from 'node:events';\n", 1)
          old = """} finally {\n  chromium?.kill('SIGTERM');\n  await writeFile(join(evidenceDir, 'chromium-sanitized.log'), browserLog.join('').replaceAll(password, '[REDACTED]'));\n  await rm(profileDir, { recursive: true, force: true });\n}\n"""
          new = """} finally {\n  if (chromium && chromium.exitCode === null) {\n    const exited = once(chromium, 'exit');\n    chromium.kill('SIGTERM');\n    await exited;\n  }\n  await writeFile(join(evidenceDir, 'chromium-sanitized.log'), browserLog.join('').replaceAll(password, '[REDACTED]'));\n  await rm(profileDir, { recursive: true, force: true });\n}\n"""
          if old not in text:
              raise SystemExit('expected Chromium cleanup block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Verify bounded diff and commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- package.json)"
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files before helper removal:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              composer.lock|package-lock.json|app/Modules/Evidence/Application/ProgressEvidenceService.php|tests/Feature/ProgressEvidenceGovernanceTest.php|scripts/ci/browser_evidence.mjs) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done
          rm .github/workflows/w04-repair-generation.yml
          git add composer.lock package-lock.json app/Modules/Evidence/Application/ProgressEvidenceService.php tests/Feature/ProgressEvidenceGovernanceTest.php scripts/ci/browser_evidence.mjs .github/workflows/w04-repair-generation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w04): close remaining verification blockers'
          git push origin HEAD:feat/cep-progress-evidence
