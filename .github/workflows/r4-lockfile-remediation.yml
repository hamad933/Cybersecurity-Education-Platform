name: R4 Lockfile Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r4-lockfile-remediation.yml'

permissions:
  contents: read

concurrency:
  group: r4-lockfile-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  composer-lock:
    name: Generate patched Composer lockfile
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/github-automation-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: php:8.5.8-cli-bookworm
    env:
      COMPOSER_VERSION: '2.10.2'
      COMPOSER_SHA256: '5EE7125F8A30A34D246CEFDC0BC85B8A783B28F2AEC968994118512350D28027'
    steps:
      - name: Install exact Composer toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl git jq libicu-dev libonig-dev libpq-dev libzip-dev unzip
          rm -rf /var/lib/apt/lists/*
          docker-php-ext-install -j"$(nproc)" intl mbstring pdo_pgsql zip
          curl --fail --silent --show-error --location "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar" -o /usr/local/bin/composer
          echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum --check --strict
          chmod +x /usr/local/bin/composer
          test "$(php -r 'echo PHP_VERSION;')" = "8.5.8"
          test "$(composer --version --no-ansi | awk '{print $3}')" = "${COMPOSER_VERSION}"

      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate and verify patched Composer lockfile
        shell: bash
        run: |
          set -euo pipefail
          composer update guzzlehttp/guzzle --with-all-dependencies --no-interaction --no-progress --prefer-dist --no-scripts
          composer validate --strict --no-check-publish
          composer show --locked guzzlehttp/guzzle --format=json | tee composer-guzzle-after.json
          jq -e '.versions | any(. == "7.15.2" or . == "* 7.15.2")' composer-guzzle-after.json
          composer audit --locked --format=json > composer-audit-after.json
          cat composer-audit-after.json
          jq -e '((.advisories // {}) | length) == 0' composer-audit-after.json
          test -s composer.lock

      - name: Upload generated Composer lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-composer-lock-${{ github.sha }}-${{ github.run_id }}
          path: |
            composer.lock
            composer-guzzle-after.json
            composer-audit-after.json
          if-no-files-found: error
          retention-days: 3

  npm-lock:
    name: Generate patched npm lockfile
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/github-automation-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: node:24.18.0-bookworm-slim
    env:
      NPM_VERSION: '11.16.0'
    steps:
      - name: Install exact npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git jq
          rm -rf /var/lib/apt/lists/*
          test "$(node --version)" = "v24.18.0"
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate and verify patched npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.overrides?.['brace-expansion'] !== '5.0.9') process.exit(1)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

          set +e
          npm audit --json --audit-level=moderate > npm-audit-after.json
          audit_code=$?
          set -e
          cat npm-audit-after.json
          test "$audit_code" -eq 0
          jq -e '.metadata.vulnerabilities.total == 0' npm-audit-after.json

          node <<'NODE'
          const lock = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));
          const versions = Object.fromEntries(
            ['brace-expansion', 'minimatch', 'postcss', 'undici'].map((name) => {
              const entry = lock.packages[`node_modules/${name}`];
              if (!entry?.version) throw new Error(`Missing locked package: ${name}`);
              return [name, entry.version];
            }),
          );
          const tuple = (value) => value.split('.').map((part) => Number.parseInt(part, 10));
          const atLeast = (actual, minimum) => {
            const a = tuple(actual);
            const b = tuple(minimum);
            for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
              const left = a[i] ?? 0;
              const right = b[i] ?? 0;
              if (left > right) return true;
              if (left < right) return false;
            }
            return true;
          };
          if (versions['brace-expansion'] !== '5.0.9') throw new Error(JSON.stringify(versions));
          if (versions.minimatch !== '10.2.5') throw new Error(JSON.stringify(versions));
          if (!atLeast(versions.postcss, '8.5.23')) throw new Error(JSON.stringify(versions));
          if (!atLeast(versions.undici, '7.29.0')) throw new Error(JSON.stringify(versions));
          require('fs').writeFileSync('npm-resolved-after.json', `${JSON.stringify(versions, null, 2)}\n`);
          NODE
          cat npm-resolved-after.json
          test -s package-lock.json

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-npm-lock-${{ github.sha }}-${{ github.run_id }}
          path: |
            package-lock.json
            npm-audit-after.json
            npm-resolved-after.json
          if-no-files-found: error
          retention-days: 3

  commit-lockfiles:
    name: Commit reproducible lockfile updates
    needs: [composer-lock, npm-lock]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/github-automation-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: chore/github-automation-foundation
    steps:
      - name: Check out authorized branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/github-automation-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Download generated Composer lockfile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-composer-lock-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-composer

      - name: Download generated npm lockfile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-npm-lock-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-npm

      - name: Verify scope, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          remote_head="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"

          cp "${RUNNER_TEMP}/r4-composer/composer.lock" composer.lock
          cp "${RUNNER_TEMP}/r4-npm/package-lock.json" package-lock.json

          test -s composer.lock
          test -s package-lock.json
          ! git diff --quiet -- composer.lock
          ! git diff --quiet -- package-lock.json

          unexpected="$(git status --porcelain=v1 | awk '{print $2}' | grep -Ev '^(composer\.lock|package-lock\.json)$' || true)"
          test -z "${unexpected}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          git commit -m "chore(deps): remediate R4 dependency advisories"
          git push origin "HEAD:${TARGET_BRANCH}"
