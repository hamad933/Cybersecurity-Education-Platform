name: CEP Work Gateway v1 Issue Publication Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-publication:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[CEP-WORK-PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted default-branch gateway revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Controller publication packet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cep-work-publish-bridge
          gh api "/repos/$REPO/issues/$ISSUE_NUMBER" > /tmp/cep-work-publish-bridge/issue.json
          python -m tools.cep_work_gateway.publish_request \
            --issue-json /tmp/cep-work-publish-bridge/issue.json \
            --repository-owner "$REPO_OWNER" \
            --packet-out /tmp/cep-work-publish-bridge/packet.json

      - name: Verify handoff, intake run and target branch provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          P=/tmp/cep-work-publish-bridge/packet.json
          HANDOFF="$(jq -r '.handoff_issue_number' "$P")"
          RUN_ID="$(jq -r '.intake_run_id' "$P")"
          INTAKE_HEAD="$(jq -r '.intake_head_sha' "$P")"
          TARGET_BRANCH="$(jq -r '.target_branch' "$P")"
          EXPECTED_REMOTE="$(jq -r '.expected_remote_sha' "$P")"
          REQUEST_ID="$(jq -r '.request_id' "$P")"
          PATCH_SHA="$(jq -r '.expected_patch_sha256' "$P")"
          PATHS_SHA="$(jq -r '.expected_paths_sha256' "$P")"

          gh api "/repos/$REPO/issues/$HANDOFF" > /tmp/cep-work-publish-bridge/handoff.json
          jq -e --arg owner "$REPO_OWNER" \
            '.user.login == $owner and .author_association == "OWNER" and (.title | startswith("[CEP-WORK-HANDOFF]"))' \
            /tmp/cep-work-publish-bridge/handoff.json >/dev/null

          gh api --paginate --slurp "/repos/$REPO/issues/$HANDOFF/comments?per_page=100" | jq 'add' \
            > /tmp/cep-work-publish-bridge/handoff-comments.json
          MARKER="CEP_WORK_INTAKE_VERIFIED request_id=$REQUEST_ID patch_sha256=$PATCH_SHA paths_sha256=$PATHS_SHA run_id=$RUN_ID intake_head_sha=$INTAKE_HEAD"
          jq -e --arg marker "$MARKER" --arg owner "$REPO_OWNER" \
            'any(.[]; .user.login == $owner and .author_association == "OWNER" and .body == $marker)' \
            /tmp/cep-work-publish-bridge/handoff-comments.json >/dev/null

          gh api "/repos/$REPO/actions/runs/$RUN_ID" > /tmp/cep-work-publish-bridge/run.json
          jq -e --arg head "$INTAKE_HEAD" \
            '.conclusion == "success" and .event == "issue_comment" and .head_sha == $head and .path == ".github/workflows/cep-work-handoff-intake.yml"' \
            /tmp/cep-work-publish-bridge/run.json >/dev/null

          ENCODED_BRANCH="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TARGET_BRANCH")"
          BRANCH_JSON="$(gh api "/repos/$REPO/branches/$ENCODED_BRANCH")"
          ACTUAL_REMOTE="$(jq -r '.commit.sha' <<<"$BRANCH_JSON")"
          test "$ACTUAL_REMOTE" = "$EXPECTED_REMOTE" || {
            echo "REMOTE_BRANCH_DRIFT expected=$EXPECTED_REMOTE actual=$ACTUAL_REMOTE" >&2
            exit 4
          }

      - name: Enforce idempotent dispatch and write intent
        id: dispatch_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          P=/tmp/cep-work-publish-bridge/packet.json
          REQUEST_ID="$(jq -r '.request_id' "$P")"
          COMMENTS="$(gh api "/repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body')"
          if grep -Fqx "CEP_WORK_PUBLISH_BRIDGE_RECEIPT request_id=$REQUEST_ID outcome=DISPATCH_ACCEPTED" <<<"$COMMENTS"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "IDEMPOTENT_ALREADY_DISPATCHED"
            exit 0
          fi
          if grep -Fqx "CEP_WORK_PUBLISH_BRIDGE_WRITE_INTENT request_id=$REQUEST_ID" <<<"$COMMENTS"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
              "CEP_WORK_PUBLISH_BRIDGE_REJECTED request_id=$REQUEST_ID reason=UNKNOWN_PRIOR_DISPATCH_OUTCOME"
            exit 5
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "CEP_WORK_PUBLISH_BRIDGE_WRITE_INTENT request_id=$REQUEST_ID"
          echo "already=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted Work candidate publisher
        if: steps.dispatch_gate.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          P=/tmp/cep-work-publish-bridge/packet.json
          jq --arg ref "main" --arg bridge_issue_number "$ISSUE_NUMBER" \
            '{ref:$ref, inputs:(. + {bridge_issue_number:$bridge_issue_number})}' "$P" \
            > /tmp/cep-work-publish-bridge/dispatch.json
          gh api -X POST "/repos/$REPO/actions/workflows/cep-work-v1-publication.yml/dispatches" \
            --input /tmp/cep-work-publish-bridge/dispatch.json --silent
          REQUEST_ID="$(jq -r '.request_id' "$P")"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "CEP_WORK_PUBLISH_BRIDGE_RECEIPT request_id=$REQUEST_ID outcome=DISPATCH_ACCEPTED"
