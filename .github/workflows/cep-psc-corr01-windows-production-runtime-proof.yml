name: CEP PSC CORR01 Windows Production Runtime Target Proof

on:
  push:
    branches:
      - cep-ps05-windows-target-proof
    paths:
      - '.github/workflows/cep-psc-corr01-windows-production-runtime-proof.yml'
      - 'psc_corr01_proof/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-2022
          - os: windows-2025
            label: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          architecture: x64

      - name: Download exact corrected candidate and exact proof harness
        shell: pwsh
        env:
          CANDIDATE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9db4-81f4-b6dd-231d42c237e0/raw?se=2026-09-17T00%3A28%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=ff2ba45c-0082-5457-83db-cea581283413&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A59%3A43Z&ske=2026-09-17T19%3A59%3A43Z&sks=b&skv=2026-02-06&sig=UX3YDDSxDF0dt0Eb8kvr0qRnBsM00HXOcksR0I4u5Eo%3D'
          HARNESS_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0334-8210-818b-cc360ba6b6c4/raw?se=2026-09-17T00%3A28%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=3c3da5fb-f259-5a81-b6f2-6268606b55e7&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A03%3A25Z&ske=2026-09-17T19%3A03%3A25Z&sks=b&skv=2026-02-06&sig=ykBS6d3cZ8BjfWSt3QX6MU4MaDm1E8D2ambkzW4gdQI%3D'
        run: |
          Invoke-WebRequest -Uri $env:CANDIDATE_URL -OutFile candidate.zip -UseBasicParsing
          Invoke-WebRequest -Uri $env:HARNESS_URL -OutFile harness.zip -UseBasicParsing
          $candidate = (Get-FileHash candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $harness = (Get-FileHash harness.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidate -ne 'd6815e72f882c249685dfd5da0ce4eb44cfb081e6b223cf6a11ad9a6d8edac9b') { throw "candidate sha mismatch: $candidate" }
          if ($harness -ne 'fc026597f59fe2c77b21d822de12cb305c99c8fffebfabe8b551f6ffba8079d8') { throw "harness sha mismatch: $harness" }
          New-Item -ItemType Directory -Force psc_corr01_proof | Out-Null
          Expand-Archive -Path harness.zip -DestinationPath psc_corr01_proof -Force
          "PSC_HARNESS_SHA256=$harness" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute complete W1-W6 target proof
        shell: pwsh
        env:
          PSC_RUNNER_LABEL: ${{ matrix.label }}
          PSC_CANDIDATE_ZIP: ${{ github.workspace }}\candidate.zip
          PSC_OUTPUT_DIR: ${{ github.workspace }}\psc_corr01_out\${{ matrix.label }}
          PSC_SERVER_WRAPPER: ${{ github.workspace }}\psc_corr01_proof\server-wrapper.mjs
          PSC_CLIENT_SCRIPT: ${{ github.workspace }}\psc_corr01_proof\client-process.mjs
        run: node psc_corr01_proof/runner.mjs

      - name: Upload complete runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSC_CORR01_${{ matrix.label }}_TARGET_PROOF
          path: psc_corr01_out/${{ matrix.label }}/**
          if-no-files-found: error
          retention-days: 30
