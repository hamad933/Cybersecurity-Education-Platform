name: CEP Jules Evidence Gateway

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cep-jules-evidence-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.actor == 'hamad933' &&
      github.event.issue.user.login == 'hamad933' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[JULES-EVIDENCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      CEP_REPOSITORY: hamad933/Cybersecurity-Education-Platform

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo 'JULES_API_KEY unavailable' >&2; exit 20; }

      - name: Read latest direct Bash evidence
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, urllib.error, urllib.parse, urllib.request

          API = os.environ['JULES_API_BASE'].rstrip('/')
          JKEY = os.environ['JULES_API_KEY']
          GH = os.environ['GH_TOKEN']
          REPO = os.environ['CEP_REPOSITORY']
          ISSUE = os.environ['ISSUE_NUMBER']
          COMMENT_CHUNK = 34000

          def req(method, url, *, token=None, body=None, timeout=60):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method)
              if token == 'github':
                  r.add_header('Authorization', f'Bearer {GH}')
                  r.add_header('Accept', 'application/vnd.github+json')
                  r.add_header('X-GitHub-Api-Version', '2022-11-28')
              elif token == 'jules':
                  r.add_header('x-goog-api-key', JKEY)
              if data is not None:
                  r.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as x:
                      raw = x.read()
                      return x.status, json.loads(raw.decode()) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors='replace')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {'error_text': raw[:1500]}
                  return e.code, payload

          def gh(method, path, body=None):
              return req(method, f'https://api.github.com/repos/{REPO}{path}',
                         token='github', body=body, timeout=30)

          def jules(method, path):
              return req(method, API + path, token='jules')

          def comment(text):
              status, _ = gh('POST', f'/issues/{ISSUE}/comments', {'body': text})
              if status not in (200, 201):
                  raise RuntimeError(f'comment_failed:{status}')

          def sanitize(text):
              text = str(text or '')
              patterns = [
                  r'(?i)(JULES_API_KEY\s*[=:]\s*)\S+',
                  r'(?i)(GDRIVE_SA_JSON_B64\s*[=:]\s*)\S+',
                  r'(?i)(authorization:\s*bearer\s+)\S+',
                  r'(?i)(x-goog-api-key\s*[=:]\s*)\S+',
              ]
              for pat in patterns:
                  text = re.sub(pat, r'\1[REDACTED]', text)
              return text

          def digest(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          def list_activities(session_id):
              rows, token = [], None
              for _ in range(100):
                  query = {'pageSize': 100}
                  if token:
                      query['pageToken'] = token
                  status, out = jules(
                      'GET',
                      f'/sessions/{session_id}/activities?' + urllib.parse.urlencode(query),
                  )
                  if status != 200:
                      return status, rows
                  rows.extend(out.get('activities') or [])
                  token = str(out.get('nextPageToken') or '')
                  if not token:
                      return 200, rows
              return 508, rows

          def emit_exact(receipt, metadata, output):
              safe = sanitize(output)
              parts = [safe[i:i + COMMENT_CHUNK] for i in range(0, len(safe), COMMENT_CHUNK)] or ['']
              meta = dict(metadata)
              meta.update({
                  'output_chars': len(safe),
                  'output_sha256': digest(safe),
                  'parts': len(parts),
              })
              comment(
                  receipt + '\nmetadata\n```json\n'
                  + json.dumps(meta, ensure_ascii=False, separators=(',', ':'))
                  + '\n```'
              )
              for i, part in enumerate(parts, start=1):
                  fragment = {'part': i, 'parts': len(parts), 'output_fragment': part}
                  comment(
                      receipt + f'\noutput_part={i}/{len(parts)}\n```json\n'
                      + json.dumps(fragment, ensure_ascii=False, separators=(',', ':'))
                      + '\n```'
                  )

          try:
              payload = json.loads(os.environ.get('ISSUE_BODY') or '')
          except json.JSONDecodeError as e:
              comment(f'JULES_EVIDENCE_REJECTED\nreason=INVALID_JSON\ndetail={e}')
              raise SystemExit(2)

          if not isinstance(payload, dict):
              comment('JULES_EVIDENCE_REJECTED\nreason=BODY_MUST_BE_JSON_OBJECT')
              raise SystemExit(2)

          action = str(payload.get('action') or '').strip()
          rid = str(payload.get('request_id') or '').strip()
          sid = str(payload.get('session_id') or '').strip()

          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:-]{0,119}', rid):
              comment('JULES_EVIDENCE_REJECTED\nreason=INVALID_REQUEST_ID')
              raise SystemExit(2)
          if action != 'get_latest_bash_output':
              comment(
                  f'JULES_EVIDENCE_REJECTED\nrequest_id={rid}\n'
                  f'reason=ACTION_NOT_ALLOWED\naction={action}'
              )
              raise SystemExit(2)
          if not re.fullmatch(r'[0-9]+', sid):
              comment(
                  f'JULES_EVIDENCE_REJECTED\nrequest_id={rid}\n'
                  'reason=VALID_SESSION_ID_REQUIRED'
              )
              raise SystemExit(2)

          status, activities = list_activities(sid)
          receipt = (
              f'JULES_EVIDENCE_RECEIPT request_id={rid}\n'
              f'action=get_latest_bash_output\nsession_id={sid}'
          )
          if status != 200:
              comment(receipt + f'\nhttp_status={status}\noutcome=ACTIVITY_LIST_READ_FAILED')
              raise SystemExit(7)

          hydrated_reads = 0
          for a in reversed(activities):
              if not any(
                  isinstance(z, dict) and isinstance(z.get('bashOutput'), dict)
                  for z in (a.get('artifacts') or [])
              ):
                  continue
              activity_name = str(a.get('name') or '')
              if not re.fullmatch(
                  r'sessions/[0-9]+/activities/[A-Za-z0-9._:-]+',
                  activity_name,
              ):
                  comment(receipt + '\noutcome=INVALID_ACTIVITY_NAME_FROM_PROVIDER')
                  raise SystemExit(7)

              hstatus, full = jules('GET', '/' + activity_name)
              hydrated_reads += 1
              if hstatus != 200:
                  comment(
                      receipt
                      + f'\noutcome=ACTIVITY_HYDRATION_READ_FAILED'
                      + f'\nactivity_name={activity_name}'
                      + f'\nactivity_http_status={hstatus}'
                  )
                  raise SystemExit(7)

              artifacts = full.get('artifacts') or []
              for artifact_index in range(len(artifacts), 0, -1):
                  artifact = artifacts[artifact_index - 1]
                  if not isinstance(artifact, dict):
                      continue
                  bo = artifact.get('bashOutput')
                  if not isinstance(bo, dict):
                      continue
                  metadata = {
                      'http_status': 200,
                      'activity_name': full.get('name') or activity_name,
                      'createTime': full.get('createTime') or a.get('createTime'),
                      'artifact_index': artifact_index,
                      'command': sanitize(bo.get('command')),
                      'exitCode': bo.get('exitCode'),
                      'activity_count_scanned': len(activities),
                      'hydrated_activity_reads': hydrated_reads,
                  }
                  emit_exact(receipt, metadata, str(bo.get('output') or ''))
                  raise SystemExit(0)

          comment(
              receipt
              + '\nhttp_status=200'
              + '\noutcome=BASH_OUTPUT_NOT_FOUND'
              + f'\nactivity_count_scanned={len(activities)}'
          )
          raise SystemExit(0)
          PY
