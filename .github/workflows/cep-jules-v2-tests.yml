name: CEP Jules Gateway v2 Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cep-jules-v2*.yml"
      - "tools/cep_jules_gateway/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v2 workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/cep-jules-v2*.yml"].sort.each { |path| YAML.load_file(path, aliases: true); puts "YAML_OK=#{path}" }'
      - name: Compile gateway modules
        run: python -m compileall -q tools/cep_jules_gateway
      - name: Run foundation and safety tests
        run: python -m unittest discover -s tools/cep_jules_gateway/tests -p 'test_*.py' -v
      - name: Confirm synthetic-only scope
        run: echo "LIVE_JULES_TESTS=NOT_RUN; no provider mutation was executed by this test workflow"
