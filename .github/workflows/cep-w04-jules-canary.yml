name: CEP W04 Jules Waiting Canary

on:
  pull_request:
    types: [synchronize]
    branches:
      - build/cep-v1-integration
    paths:
      - .github/workflows/cep-w04-jules-canary.yml
      - scripts/controller/jules_adapter.py
      - scripts/controller/w04_waiting_canary.py
      - tests/controller/test_jules_adapter_contract.py

concurrency:
  group: cep-w04-jules-waiting-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Parent-authorized W04 same-session canary
    if: >-
      github.event.pull_request.number == 39 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/cep-jules-control-plane-r01-6545870808418194176'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout only trusted controller paths from exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/controller
            tests/controller
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Jules adapter contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tests/controller/test_jules_adapter_contract.py

      - name: Send bounded W04 continuation if exact waiting state matches
        env:
          PYTHONPATH: ${{ github.workspace }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 scripts/controller/w04_waiting_canary.py \
            --receipt-out /tmp/w04-canary-receipt.json

      - name: Upload sanitized canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cep-w04-jules-canary-receipt
          path: /tmp/w04-canary-receipt.json
          if-no-files-found: warn
          retention-days: 7
