name: Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'build/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5.8'
  COMPOSER_VERSION: '2.10.2'
  COMPOSER_SHA256: '5EE7125F8A30A34D246CEFDC0BC85B8A783B28F2AEC968994118512350D28027'
  NODE_VERSION: '24.18.0'
  NPM_VERSION: '11.16.0'
  POSTGRES_VERSION: '18.4'

jobs:
  frontend-assets:
    name: Frontend manifest preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: node:24.18.0-bookworm-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
          rm -rf /var/lib/apt/lists/*
          test "$(node --version)" = "v${NODE_VERSION}"
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Build CI-only frontend manifest
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json

      - name: Upload CI-only frontend assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cybersecurity-Education-Platform-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-php-frontend-assets
          path: public/build
          if-no-files-found: error
          retention-days: 14

  php-quality:
    name: PHP quality and tests
    needs: frontend-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: php:8.5.8-cli-bookworm
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: cyber_platform_test
          POSTGRES_USER: task006_test
          POSTGRES_PASSWORD: ci_test_only_password
          PGDATA: /var/lib/postgresql/18/docker
        options: >-
          --health-cmd "pg_isready -U task006_test -d cyber_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_PROFILE: test
      APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: cyber_platform_test
      DB_USERNAME: task006_test
      DB_PASSWORD: ci_test_only_password
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      SESSION_TABLE: application_sessions
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      FILESYSTEM_DISK: local
      BLOB_DISK: local
      BLOB_ROOT: blobs
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install PHP extension build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates curl git unzip libicu-dev libonig-dev libpq-dev libzip-dev postgresql-client
          docker-php-ext-install intl mbstring pdo_pgsql zip
          rm -rf /var/lib/apt/lists/*

      - name: Verify exact PHP and Composer toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "${PHP_VERSION}"
          curl --fail --silent --show-error --location https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar -o /usr/local/bin/composer
          echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum --check --strict
          chmod +x /usr/local/bin/composer
          test "$(composer --version --no-ansi | sed -E 's/Composer version ([0-9.]+).*/\1/')" = "${COMPOSER_VERSION}"

      - name: Install locked PHP dependencies
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Download CI-only frontend assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cybersecurity-Education-Platform-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-php-frontend-assets
          path: public/build

      - name: Run PHP quality and tests
        shell: bash
        run: bash scripts/ci/core_php.sh

      - name: Finalize PHP evidence
        if: always()
        shell: bash
        run: bash scripts/ci/finalize_evidence.sh php-quality

      - name: Upload PHP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cybersecurity-Education-Platform-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-php-quality
          path: .ci/evidence/php-quality
          if-no-files-found: error
          retention-days: 14

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: node:24.18.0-bookworm-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
          rm -rf /var/lib/apt/lists/*
          test "$(node --version)" = "v${NODE_VERSION}"
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install locked frontend dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend quality and build
        shell: bash
        run: bash scripts/ci/core_frontend.sh

      - name: Finalize frontend evidence
        if: always()
        shell: bash
        run: bash scripts/ci/finalize_evidence.sh frontend-quality

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cybersecurity-Education-Platform-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-frontend-quality
          path: .ci/evidence/frontend-quality
          if-no-files-found: error
          retention-days: 14

  compose-validation:
    name: Compose structural validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Compose structure
        shell: bash
        run: |
          set -euo pipefail
          php scripts/validate_compose.php

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run repository secret scan
        shell: bash
        run: php scripts/secret_scan.php

  required-gate-summary:
    name: Required gate summary
    if: always()
    needs:
      - php-quality
      - frontend-quality
      - compose-validation
      - secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required job results
        shell: bash
        env:
          PHP_RESULT: ${{ needs.php-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          COMPOSE_RESULT: ${{ needs.compose-validation.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          printf 'php-quality=%s\nfrontend-quality=%s\ncompose-validation=%s\nsecret-scan=%s\n' \
            "$PHP_RESULT" "$FRONTEND_RESULT" "$COMPOSE_RESULT" "$SECRET_RESULT"
          test "$PHP_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$SECRET_RESULT" = success
